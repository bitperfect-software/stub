name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Check (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [22.x, 24.x]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            - run: npm run build

    package:
        name: Packaged CLI (${{ matrix.os }}, Node ${{ matrix.node }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node: ["20.19.0", 24.x]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            # `npm pack` runs `prepack`, so this exercises the real build and the real tarball.
            - name: Install the packed tarball globally and run it
              shell: bash
              run: |
                  tarball="$(node -p "const p = require('./package.json'); \`\${p.name.replace('@', '').replace('/', '-')}-\${p.version}.tgz\`")"
                  npm pack --pack-destination "$RUNNER_TEMP"
                  npm install --global "$RUNNER_TEMP/$tarball"
                  stub --version
                  stub --help
                  stub guide > /dev/null
