name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Check (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [22.x, 24.x]
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run typecheck
            - run: pnpm run lint
            - run: pnpm run format:check
            - run: pnpm test
            - run: pnpm run build

    pack:
        name: Pack the tarball
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # `pnpm pack` runs `prepack`, so this exercises the real build and the real tarball.
            - run: pnpm pack --pack-destination "$RUNNER_TEMP"
            - uses: actions/upload-artifact@v7
              with:
                  name: tarball
                  path: ${{ runner.temp }}/*.tgz
                  if-no-files-found: error

    consume:
        # pnpm 11 needs Node >= 22.13, a hair above the package's own >= 22.12.0 floor.
        # Installing the tarball with npm is both what a consumer actually does and the only way
        # to exercise that floor.
        name: Consume (${{ matrix.os }}, Node ${{ matrix.node }})
        needs: pack
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node: ["22.12.0", 24.x]
        steps:
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
            - uses: actions/download-artifact@v8
              with:
                  name: tarball
                  path: ${{ runner.temp }}/tarball
            - name: Install the packed tarball globally and run it
              shell: bash
              run: |
                  tarball="$(ls "$RUNNER_TEMP"/tarball/*.tgz)"
                  npm install --global "$tarball"
                  stub --version
                  stub --help
                  stub guide > /dev/null
