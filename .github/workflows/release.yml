name: Release

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
            - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Publish to npm
        runs-on: ubuntu-latest
        permissions:
            contents: write # gh release create
            id-token: write # required for trusted publishing
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Verify the tag matches package.json
              id: version
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  pkg="$(node -p "require('./package.json').version")"
                  if [ "$tag" != "$pkg" ]; then
                    echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
                    exit 1
                  fi
                  echo "version=${pkg}" >> "$GITHUB_OUTPUT"
                  case "$pkg" in
                    *-*) echo "dist_tag=next"   >> "$GITHUB_OUTPUT" ;;
                    *)   echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
                  esac

            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            - run: npm run build

            - name: Smoke-test the built bundle
              run: |
                  node dist/index.js --version
                  node dist/index.js --help

            - name: Publish
              run: |
                  name="$(node -p "require('./package.json').name")"
                  if npm view "${name}@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
                    echo "::notice::${name}@${{ steps.version.outputs.version }} is already published; skipping"
                    exit 0
                  fi
                  npm publish --access public --tag "${{ steps.version.outputs.dist_tag }}"

            - name: Create the GitHub release
              run: gh release create "$GITHUB_REF_NAME" --generate-notes ${{ steps.version.outputs.dist_tag == 'next' && '--prerelease' || '' }}
              env:
                  GH_TOKEN: ${{ github.token }}
